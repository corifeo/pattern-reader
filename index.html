<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6f0">
<title>Pattern Reader</title>
<style>
  :root {
    --bg: #faf6f0; --ink: #2b2622; --soft: #8a7f75; --line: #e6ddd0;
    --accent: #b4552d; --tint: #f6e4d8; --card: #fffdf9; --scale: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --ink: #ece5dc; --soft: #9a8f84; --line: #37312c;
            --accent: #e58a5c; --tint: #3a2a21; --card: #25211e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: .6em .9em; }
  button:active { transform: scale(.97); }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 0 1.1rem; }
  [hidden] { display: none !important; }

  /* Home */
  #home { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 2rem 0; }
  #home h1 { font: 600 2rem/1.1 Georgia, "Iowan Old Style", serif; margin: 0 0 .3em; }
  #home p.lead { color: var(--soft); margin: 0 0 1.6rem; }
  #url, #paste { width: 100%; padding: .9em 1em; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  #paste { min-height: 9rem; resize: vertical; margin-top: .6rem; }
  .row { display: flex; gap: .6rem; margin-top: .7rem; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  details { margin-top: 1.2rem; color: var(--soft); }
  summary { cursor: pointer; padding: .3rem 0; }
  #status { margin-top: 1rem; min-height: 1.5em; color: var(--soft); }
  #status.err { color: var(--accent); }
  #resume { margin-top: 1.6rem; width: 100%; text-align: left; }
  #resume small { display: block; color: var(--soft); }

  /* Reader */
  #bar { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
         padding-top: env(safe-area-inset-top); }
  #bar .wrap { display: flex; align-items: center; gap: .4rem; padding-top: .5rem; padding-bottom: .5rem; }
  #bar button { padding: .4em .7em; font-size: .9rem; }
  #count { margin-left: auto; color: var(--soft); font-size: .9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #title { font: 600 1.6rem/1.2 Georgia, "Iowan Old Style", serif; margin: 1.4rem 0 .2rem; }
  #src { color: var(--soft); font-size: .85rem; word-break: break-all; display: block; margin-bottom: 1rem; }
  #note { color: var(--soft); font-size: .9rem; border: 1px dashed var(--line); border-radius: 12px; padding: .7rem .9rem; margin-bottom: 1rem; }
  #lines { padding-bottom: 45vh; font-size: calc(1.2rem * var(--scale)); line-height: 1.55; }
  .ln { padding: .55em .8em; margin: .15em -.8em; border-radius: 12px; border-left: 4px solid transparent;
        cursor: pointer; transition: background .2s, opacity .2s; scroll-margin: 40vh 0; }
  .ln.h { font: 600 1.15em/1.3 Georgia, "Iowan Old Style", serif; margin-top: 1.4em; cursor: default; }
  .ln.note { color: var(--soft); font-size: .9em; }
  .ln.done { opacity: .4; }
  .ln.cur { background: var(--tint); border-left-color: var(--accent); color: var(--ink); opacity: 1; font-weight: 600; }

  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--line);
          padding-bottom: env(safe-area-inset-bottom); }
  #prog { height: 3px; background: var(--accent); width: 0; }
  #prog.run { animation: fill linear forwards; }
  @keyframes fill { from { width: 0 } to { width: 100% } }
  #dock .wrap { display: flex; gap: .5rem; padding-top: .6rem; padding-bottom: .6rem; align-items: stretch; }
  #next { flex: 1; font-size: 1.15rem; padding: .85em; }
  #prev, #auto { min-width: 3.2rem; font-size: 1.1rem; }
  #auto.on { background: var(--tint); border-color: var(--accent); }
  #pace { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 .4em; }
</style>
</head>
<body>

<main id="home" class="wrap">
  <h1>Pattern Reader</h1>
  <p class="lead">Paste a link to a crochet pattern. Get just the pattern, big and clean.</p>
  <input id="url" type="url" inputmode="url" placeholder="https://…" autocomplete="off" autocapitalize="off">
  <div class="row">
    <button id="go" class="primary">Open pattern</button>
    <button id="loadBtn">Load .txt</button>
  </div>
  <input id="file" type="file" accept=".txt,text/plain" hidden>
  <details>
    <summary>Link not working? Paste the text instead</summary>
    <textarea id="paste" placeholder="Select the pattern on the original page, copy, and paste it here"></textarea>
    <div class="row"><button id="pasteGo">Read pasted text</button></div>
  </details>
  <div id="status" role="status"></div>
  <button id="resume" hidden></button>
</main>

<div id="reader" hidden>
  <div id="bar"><div class="wrap">
    <button id="back" aria-label="Back">←</button>
    <button id="smaller" aria-label="Smaller text">A−</button>
    <button id="bigger" aria-label="Bigger text">A+</button>
    <button id="mode"></button>
    <button id="save">Save</button>
    <span id="count"></span>
  </div></div>
  <div class="wrap">
    <h1 id="title"></h1>
    <a id="src" target="_blank" rel="noopener noreferrer"></a>
    <div id="note" hidden></div>
    <div id="lines"></div>
  </div>
  <div id="dock">
    <div id="prog"></div>
    <div class="wrap">
      <button id="prev" aria-label="Previous line">↑</button>
      <button id="next" class="primary">Next line ↓</button>
      <button id="auto" aria-label="Auto advance">▶</button>
      <select id="pace" aria-label="Auto advance pace">
        <option value="15">15 s</option><option value="30">30 s</option>
        <option value="60" selected>1 min</option><option value="120">2 min</option>
        <option value="300">5 min</option>
      </select>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- Extraction ---------- */
const JUNK_SEL = 'script,style,noscript,template,iframe,nav,footer,aside,form,ins,svg,button,figure,video,audio,select,input,textarea,picture,img';
const JUNK_RE = /(^|[-_ ])(ads?|advert\w*|sidebar|comments?|respond|share\w*|social|related|newsletter|subscribe|popup|modal|cookie\w*|promo|widget\w*|breadcrumbs?|footer|nav|menu|author|sponsor\w*|pagination|tags)($|[-_ ])|adthrive|mediavine|adsbygoogle|raptive/i;
const BLOCK = new Set('P DIV LI UL OL H1 H2 H3 H4 H5 H6 TR TABLE SECTION ARTICLE BLOCKQUOTE PRE DD DT DL MAIN BODY HEADER'.split(' '));
const NOISE = /^(advertisement|share|pin( it)?|print|save|jump to .*|skip to .*|leave a (comment|reply)|read more|continue reading|click here.*|subscribe|follow( me)?|tweet|email|facebook|pinterest|instagram)$/i;

const ROW = /^\s*(\([^)]{1,15}\)\s*)?(rows?|rounds?|rnds?|rd|r|step)\s*\.?\s*\d+(\s*(-|–|—|to|&|and|,)\s*\d+)*\s*([:.)\-–—]?)/i;
const END = /related posts|you may (also )?(like|love)|trending|hi!? i.m|about (me|the author)|leave a|comment|newsletter|subscribe|copyright|©|thank(s| you)|hope you|tag me|follow me|instagram|facebook|pinterest|more (free )?patterns/i;
const ABBR = /\b(sc|dc|hdc|htr|tr|dtr|ch|sl ?st|ss|sts?|inc|dec|sc2tog|dc2tog|hdc2tog|invdec|mr|mc|blo|flo|yo|sk|rep|tog|fpdc|bpdc|fo)\b/gi;
const WORDS = /\b(single crochet|double crochet|half double|treble|chains?|slip st(itch)?|magic (ring|circle)|fasten off|stitch(es)?|yarn over|skip|turn|increase|decrease|repeat|join)\b/gi;
const SECTION = /^(materials?|supplies|what you('ll| will)? need|you('ll| will) need|abbreviations?|stitches( used)?|stitch (guide|key)|terms|gauge|tension|notes?|pattern( notes| instructions)?|instructions?|finished size|size|yarn|hook)\b/i;

/* 3 = pattern instruction, 2 = short stitch definition, 0 = anything else.
   Prose that merely mentions stitches must not count, so long lines need a row label or a high stitch density. */
function score(t) {
  const words = t.split(/\s+/).length;
  const abbr = (t.match(ABBR) || []).length, w = (t.match(WORDS) || []).length, n = abbr + w;
  const hasCount = /[(\[<]\s*\d+(\s*sts?| stitches)?\s*[)\]>]\s*\.?\s*$/i.test(t) ||
                   /\b\d+\s+(sc|hdc|dc|tr|sts?|stitches|slip sts?|sl ?sts?|ch|chains?)\s*[.)\]]?\s*$/i.test(t);
  const row = t.match(ROW);
  const step = t.length <= 400 && (
    (row && words < 80 && (row[5] || n >= 1)) ||
    (hasCount && n >= 1) ||
    (n >= 3 && n / words >= (words <= 25 ? 0.2 : 0.35)) ||
    (/^\d+\s*[.):]/.test(t) && n >= 2 && words < 40));
  if (step) return 3;
  return t.length < 80 && n >= 1 ? 2 : 0;
}

function cleanLines(raw) {
  const out = [];
  for (const l of raw) {
    const t = l.t.replace(/\s+/g, ' ').trim();
    if (t.length < 2 || NOISE.test(t)) continue;
    if (out.length && out[out.length - 1].t === t) continue;
    out.push({ t, h: !!l.h });
  }
  return out;
}

function parseHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const og = doc.querySelector('meta[property="og:title"]');
  const h1 = doc.querySelector('h1');
  const title = ((og && og.getAttribute('content')) || (h1 && h1.textContent) || doc.title || '').replace(/\s+/g, ' ').trim();
  const body = doc.body;
  if (!body) return { title, lines: [] };
  const hasRows = e => (e.textContent.match(/\b(rows?|rnds?|rounds?)\s*\d+\s*[:.\-–]/gi) || []).length >= 3;
  body.querySelectorAll('script,style,noscript,template').forEach(e => e.remove());
  body.querySelectorAll(JUNK_SEL).forEach(e => { if (!hasRows(e)) e.remove(); });
  const total = body.textContent.length || 1;
  body.querySelectorAll('[class],[id]').forEach(e => {
    if (!e.isConnected) return;
    const key = (e.getAttribute('class') || '') + ' ' + (e.id || '');
    if (JUNK_RE.test(key) && e.textContent.length < total * 0.4 && !hasRows(e)) e.remove();
  });
  const raw = []; let cur = '';
  const flush = h => { if (cur.trim()) raw.push({ t: cur, h }); cur = ''; };
  (function walk(node) {
    for (const c of node.childNodes) {
      if (c.nodeType === 3) cur += c.nodeValue;
      else if (c.nodeType === 1) {
        const tag = c.tagName;
        if (tag === 'BR' || tag === 'HR') { flush(false); continue; }
        const block = BLOCK.has(tag);
        if (block) flush(false);
        walk(c);
        if (tag === 'TD' || tag === 'TH') cur += ' ';
        const only = c.children.length === 1 && /^(STRONG|B)$/.test(c.children[0].tagName) &&
                     c.textContent.trim() === c.children[0].textContent.trim() && c.textContent.length < 80;
        if (block) flush(/^H[1-6]$/.test(tag) || (tag === 'P' && only));
      }
    }
  })(body);
  flush(false);
  return { title, lines: cleanLines(raw) };
}

function parseMarkdown(text) {
  let title = '';
  const m = text.match(/^Title:\s*(.+)$/m);
  if (m) title = m[1].trim();
  const i = text.indexOf('Markdown Content:');
  if (i >= 0) text = text.slice(i + 17);
  const raw = text.split(/\r?\n/).map(l => {
    let s = l.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
             .replace(/\*\*|__|`/g, '').replace(/\|/g, ' ').replace(/^\s*(>|[-*+]\s)\s*/, '');
    const h = /^\s*#{1,6}\s+/.test(s);
    if (h) s = s.replace(/^\s*#{1,6}\s+/, '');
    if (/^[\s\-=:]*$/.test(s)) s = '';
    return { t: s, h };
  });
  return { title, lines: cleanLines(raw) };
}

function parseTxt(text) {
  let title = '', url = '';
  const raw = [];
  for (const l of text.split(/\r?\n/)) {
    let m;
    if (!title && (m = l.match(/^#\s+(.+)/)) && !/^#\s+Source:/i.test(l)) { title = m[1].trim(); continue; }
    if (!url && (m = l.match(/^#\s+Source:\s*(\S+)/i))) { url = m[1]; continue; }
    if ((m = l.match(/^##\s+(.+)/))) raw.push({ t: m[1], h: true });
    else raw.push({ t: l, h: false });
  }
  return { title, url, lines: cleanLines(raw) };
}

/* Classify lines and find where the pattern starts and ends. */
function buildPattern(lines) {
  let steps = [];
  lines.forEach((l, i) => {
    l.s = score(l.t);
    if (!l.h && l.s < 2 && l.t.length <= 50 && (/:$/.test(l.t) || (l.t === l.t.toUpperCase() && /[A-Z]{3}/.test(l.t)))) l.h = true;
    if (!l.h && l.s < 3 && l.t.length <= 40 && SECTION.test(l.t) && !/[.!?]$/.test(l.t)) l.h = true;
    if (!l.h && l.s >= 3) steps.push(i);
  });
  /* Group instruction lines that sit close together; stray matches in the story or comments are ignored. */
  const clusters = [];
  for (const i of steps) {
    const c = clusters[clusters.length - 1];
    if (c && i - c[c.length - 1] <= 10) c.push(i); else clusters.push([i]);
  }
  const big = clusters.filter(c => c.length >= 3);
  /* Strict: keep only each block of rows, the heading and set-up line right above it, and a closing "fasten off". */
  for (const c of big) {
    const first = c[0], last = c[c.length - 1];
    let a = first;
    for (let i = first - 1; i >= Math.max(0, first - 3); i--) {
      if (lines[i].s >= 3 || lines[i].t.length > 200) break;
      if (lines[i].h) { a = i; break; }
    }
    if (a === first && first > 0 && lines[first - 1].s < 3 && lines[first - 1].t.length <= 200 && !END.test(lines[first - 1].t)) a = first - 1;
    let b = last + 1;
    for (let k = 0; k < 2 && b < lines.length && !lines[b].h && lines[b].s === 2; k++) b++;
    for (let i = a; i < b; i++) if (lines[i].s >= 3 || lines[i].h || !END.test(lines[i].t)) lines[i].k = true;
  }
  return { lines, found: big.length > 0, steps: steps.length };
}

/* ---------- Fetching (GitHub Pages cannot read other sites directly, so go via public CORS proxies) ---------- */
const PROXIES = [
  u => ['https://api.allorigins.win/raw?url=' + encodeURIComponent(u), 'html'],
  u => ['https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u), 'html'],
  u => ['https://corsproxy.io/?url=' + encodeURIComponent(u), 'html'],
  u => ['https://r.jina.ai/' + u, 'md']
];

async function grab(make, url) {
  const [purl, type] = make(url);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 15000);
  try {
    const res = await fetch(purl, { signal: ctl.signal });
    const text = await res.text();
    if (!res.ok || text.length < 300) throw new Error('bad response');
    const parsed = type === 'md' ? parseMarkdown(text) : parseHtml(text);
    if (!parsed.lines.length) throw new Error('empty');
    return Object.assign(buildPattern(parsed.lines), { title: parsed.title });
  } finally { clearTimeout(timer); }
}

/* Ask every proxy at once and take the first answer that contains a pattern. */
async function fetchPattern(url) {
  const tries = PROXIES.map(m => grab(m, url));
  try {
    return await Promise.any(tries.map(t => t.then(p => { if (!p.found) throw new Error('no pattern'); return p; })));
  } catch (e) {}
  const done = await Promise.allSettled(tries);
  const ok = done.filter(d => d.status === 'fulfilled').map(d => d.value);
  return ok.sort((x, y) => y.lines.length - x.lines.length)[0] || null;
}

/* ---------- Reader ---------- */
let S = null;          // { title, url, lines, a, b, found, pos, showAll }
let timer = null, wake = null;

function vis() {
  const all = S.lines.map((l, i) => i);
  if (S.showAll || !S.found) return all;
  const kept = all.filter(i => S.lines[i].k);
  return kept.length ? kept : all;
}
function persist() { store.set('pr.current', S); }

function open(p, url) {
  if (!p || !p.lines.length) return false;
  S = { title: p.title || 'Pattern', url: url || p.url || '', lines: p.lines, found: p.found, pos: -1, showAll: false };
  for (const i of vis()) if (!S.lines[i].h && (S.lines[i].s >= 3 || !S.found)) { S.pos = i; break; }
  show();
  return true;
}

function show() {
  $('home').hidden = true; $('reader').hidden = false;
  $('title').textContent = S.title;
  const okUrl = /^https?:\/\//i.test(S.url);
  $('src').hidden = !okUrl;
  if (okUrl) { $('src').textContent = S.url; $('src').href = S.url; }
  render();
  persist();
  keepAwake();
}

function render() {
  const v = vis();
  const box = $('lines');
  box.textContent = '';
  for (const i of v) {
    const l = S.lines[i], d = document.createElement('div');
    d.className = 'ln ' + (l.h ? 'h' : l.s >= 2 || !S.found ? 'step' : 'note');
    d.dataset.i = i;
    d.textContent = l.t;
    box.appendChild(d);
  }
  $('mode').textContent = S.showAll ? 'Pattern only' : 'Whole page';
  $('mode').hidden = !S.found;
  $('note').hidden = S.found;
  if (!S.found) $('note').textContent = 'I could not tell which part is the pattern, so this is all the text from the page. Tap the line where the pattern starts.';
  if (!v.includes(S.pos)) S.pos = -1;
  mark(false);
}

function mark(scroll) {
  let n = 0, k = 0;
  for (const d of $('lines').children) {
    const i = +d.dataset.i, isH = skip(S.lines[i]);
    if (!isH) { n++; if (i <= S.pos) k++; }
    d.classList.toggle('cur', i === S.pos);
    d.classList.toggle('done', S.pos >= 0 && i < S.pos && !isH);
    if (i === S.pos && scroll) d.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  $('count').textContent = (S.pos < 0 ? 0 : k) + ' / ' + n;
}

function skip(l) { return l.h; }

function step(dir) {
  const v = vis().filter(i => !skip(S.lines[i]));
  const at = v.indexOf(S.pos);
  const to = S.pos < 0 || at < 0 ? (dir > 0 ? 0 : v.length - 1) : at + dir;
  if (to < 0 || to >= v.length) { if (dir > 0) stopAuto(); return; }
  S.pos = v[to]; mark(true); persist();
  if (timer) restartProgress();
}

function restartProgress() {
  const p = $('prog');
  p.classList.remove('run'); void p.offsetWidth;
  p.style.animationDuration = $('pace').value + 's';
  p.classList.add('run');
}
function startAuto() {
  stopAuto();
  timer = setInterval(() => step(1), +$('pace').value * 1000);
  $('auto').classList.add('on'); $('auto').textContent = '⏸';
  restartProgress();
}
function stopAuto() {
  if (timer) clearInterval(timer);
  timer = null;
  $('auto').classList.remove('on'); $('auto').textContent = '▶';
  $('prog').classList.remove('run');
}

async function keepAwake() {
  try { if (navigator.wakeLock && !$('reader').hidden) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) keepAwake(); });

function saveTxt() {
  let out = '# ' + S.title + '\n' + (S.url ? '# Source: ' + S.url + '\n' : '') + '\n';
  for (const i of vis()) out += S.lines[i].h ? '\n## ' + S.lines[i].t + '\n' : S.lines[i].t + '\n';
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([out], { type: 'text/plain' }));
  link.download = (S.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'pattern') + '.txt';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 5000);
}

function setScale(delta) {
  const v = Math.min(2, Math.max(0.8, store.get('pr.scale', 1) + delta));
  store.set('pr.scale', v);
  document.documentElement.style.setProperty('--scale', v);
}

function status(msg, err) { $('status').textContent = msg; $('status').className = err ? 'err' : ''; }

function openText(text, fallbackTitle) {
  const t = parseTxt(text);
  const p = Object.assign(buildPattern(t.lines), { title: t.title || fallbackTitle, url: t.url });
  if (!open(p)) status('That text looks empty.', true);
}

async function go() {
  let url = $('url').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try { new URL(url); } catch (e) { return status('That does not look like a web address.', true); }
  $('go').disabled = true; status('Fetching the page…');
  const p = await fetchPattern(url);
  $('go').disabled = false;
  if (!open(p, url)) return status('Could not read that page. Open it, copy the pattern, and use the paste option below.', true);
  status('');
  try { history.replaceState(null, '', '?url=' + encodeURIComponent(url)); } catch (e) {}
}

function home() {
  stopAuto();
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  $('reader').hidden = true; $('home').hidden = false;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  offerResume();
}
function offerResume() {
  const c = store.get('pr.current', null), r = $('resume');
  r.hidden = !(c && c.lines && c.lines.length);
  if (!r.hidden) { r.textContent = 'Continue: ' + c.title; const s = document.createElement('small'); s.textContent = 'Picks up at the line you left'; r.appendChild(s); }
}

/* ---------- Wiring ---------- */
$('go').onclick = go;
$('url').onkeydown = e => { if (e.key === 'Enter') go(); };
$('loadBtn').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  openText(await f.text(), f.name.replace(/\.txt$/i, ''));
  e.target.value = '';
};
$('pasteGo').onclick = () => openText($('paste').value, 'Pasted pattern');
$('resume').onclick = () => { S = store.get('pr.current', null); if (S) show(), mark(true); };
$('back').onclick = home;
$('smaller').onclick = () => setScale(-0.1);
$('bigger').onclick = () => setScale(0.1);
$('mode').onclick = () => { S.showAll = !S.showAll; render(); mark(true); persist(); };
$('save').onclick = saveTxt;
$('next').onclick = () => step(1);
$('prev').onclick = () => step(-1);
$('auto').onclick = () => timer ? stopAuto() : startAuto();
$('pace').onchange = () => { store.set('pr.pace', $('pace').value); if (timer) startAuto(); };
$('lines').onclick = e => {
  const d = e.target.closest('.ln'); if (!d || S.lines[+d.dataset.i].h) return;
  S.pos = +d.dataset.i; mark(false); persist(); if (timer) startAuto();
};
document.addEventListener('keydown', e => {
  if ($('reader').hidden || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
});

setScale(0);
$('pace').value = store.get('pr.pace', '60');
offerResume();
const q = new URLSearchParams(location.search).get('url');
if (q) { $('url').value = q; go(); }
</script>
</body>
</html>
